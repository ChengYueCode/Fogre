<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forge 学习页</title>
<style>
  :root {
    --bg: #f1f5fa;
    --bg-2: #f1f5fa;
    --card: #ffffff;
    --card-2: #e8eff7;
    --ink: #172b43;
    --ink-soft: #50637a;
    --ink-faint: #50637a;
    --line: #bdcbdc;
    --line-strong: #bdcbdc;
    --green: #236044;
    --green-soft: #e3f2e9;
    --amber: #805200;
    --amber-soft: #fff1cf;
    --red: #a32b35;
    --red-soft: #fde8eb;
    --blue: #2857a4;
    --shadow: 0 1px 2px rgba(23, 43, 67, 0.06), 0 6px 18px rgba(23, 43, 67, 0.06);
    --radius: 12px;
    --focus: 0 0 0 3px rgba(40, 87, 164, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 700px at 12% -10%, var(--card) 0%, var(--bg) 45%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.65;
    min-height: 100vh;
  }
  h1, h2, h3, h4 { line-height: 1.35; margin: 0 0 0.4em; font-weight: 650; }
  p { margin: 0 0 0.7em; }
  button {
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 6px 11px;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover { background: var(--card-2); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: none; box-shadow: var(--focus);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.primary:hover { background: var(--ink); }
  button.ghost { background: transparent; }
  input[type="text"], input[type="number"], textarea, select {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line-strong); border-radius: 9px; padding: 7px 9px; width: 100%;
  }
  textarea { resize: vertical; min-height: 84px; }
  a { color: var(--blue); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  [hidden] { display: none !important; }

  #app { max-width: 1500px; margin: 0 auto; padding: 14px clamp(10px, 2vw, 22px) 40px; }

  .topbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between;
    padding: 14px 16px; margin-bottom: 12px;
    background: linear-gradient(180deg, #ffffff, var(--card-2));
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .topbar-main { min-width: 240px; flex: 1 1 420px; }
  .brand { font-size: 12px; letter-spacing: 0.14em; color: var(--green); text-transform: uppercase; font-weight: 700; }
  #docTitle { font-size: clamp(19px, 2.4vw, 26px); margin: 2px 0 4px; }
  #docGoal { color: var(--ink-soft); max-width: 70ch; margin: 0; }
  .topbar-side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .badge {
    display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--green-soft); color: var(--green); border: 1px solid var(--line-strong); white-space: nowrap;
  }
  .save-status { font-size: 12px; color: var(--ink-faint); min-height: 1.2em; }
  .save-status.s-saving { color: var(--amber); }
  .save-status.s-saved { color: var(--green); }
  .save-status.s-error { color: var(--red); }
  .io-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .io-actions button { font-size: 12px; padding: 5px 9px; }

  .banner { padding: 10px 13px; border-radius: 10px; margin-bottom: 10px; border: 1px solid; font-size: 14px; }
  .banner-warn { background: var(--amber-soft); border-color: var(--line-strong); color: var(--amber); }
  .banner-error { background: var(--red-soft); border-color: var(--line-strong); color: var(--red); }
  .banner .banner-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .banner .banner-actions button { font-size: 13px; }
  .conflict-item { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-strong); }

  .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(330px, 1fr); gap: 14px; align-items: start; }
  .graph-pane, .side-pane {
    min-width: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .graph-pane { display: flex; flex-direction: column; overflow: hidden; }
  .side-pane { display: flex; flex-direction: column; min-height: 520px; }

  .graph-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 9px; border-bottom: 1px solid var(--line); background: var(--card-2); }
  .graph-toolbar button { font-size: 13px; padding: 5px 9px; }
  .graph-toolbar .toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-soft); padding: 4px 6px; }
  .graph-toolbar .toggle input { width: auto; }

  .graph { position: relative; height: clamp(360px, 62vh, 680px); overflow: hidden; background:
      linear-gradient(0deg, rgba(40, 87, 164, 0.03), rgba(40, 87, 164, 0.03)),
      radial-gradient(600px 300px at 20% 0%, #ffffff, var(--bg)); cursor: grab; touch-action: none; }
  .graph:active { cursor: grabbing; }
  .graph-stage { position: absolute; inset: 0; }
  .graph-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .edge-svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .node-layer, .rel-label-layer { position: absolute; top: 0; left: 0; }
  .graph-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); }

  .hier-edge { stroke: var(--line-strong); stroke-width: 2; fill: none; }
  .rel-edge { fill: none; stroke-width: 2.1; }
  .node {
    position: absolute; display: flex; flex-direction: column; justify-content: space-between;
    padding: 8px 10px; border-radius: 11px; overflow: hidden; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line-strong);
    box-shadow: 0 1px 0 rgba(23, 43, 67, 0.04);
  }
  .node.depth-0 { background: var(--card-2); border-color: var(--line-strong); }
  .node.depth-1 { background: var(--card-2); }
  .node.depth-2 { background: var(--card); }
  .node.depth-3 { background: #ffffff; }
  .node.selected { border-color: var(--green); box-shadow: 0 0 0 2px rgba(40, 87, 164, 0.25), 0 4px 12px rgba(40, 87, 164, 0.12); }
  .node-title { font-size: 14px; line-height: 19px; font-weight: 600; word-break: break-word; overflow: hidden; }
  .node-badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; font-size: 10.5px; line-height: 1.4; }
  .badge-diff { color: var(--ink-faint); }
  .badge-mastery { padding: 1px 6px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .m-unknown { background: var(--card-2); color: var(--ink-soft); }
  .m-pending { background: var(--amber-soft); color: var(--amber); }
  .m-needs { background: var(--red-soft); color: var(--red); }
  .m-explained { background: var(--green-soft); color: var(--green); }
  .m-applied { background: var(--green-soft); color: var(--green); }
  .m-retained { background: var(--green-soft); color: var(--green); }
  .collapse-btn {
    position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; padding: 0;
    line-height: 1; font-size: 13px; border-radius: 6px; background: rgba(255,255,255,0.85);
    border: 1px solid var(--line-strong); z-index: 2;
  }
  .rel-label {
    position: absolute; transform: translate(-50%, -50%); font-size: 12px; padding: 1px 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    white-space: nowrap; color: var(--ink-soft); pointer-events: none;
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 9px 12px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft); background: var(--card-2);
  }
  .legend .leg { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { display: block; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 9px 9px 0; border-bottom: 1px solid var(--line); }
  .tabs button {
    border: 1px solid transparent; background: transparent; border-radius: 9px 9px 0 0; padding: 7px 12px; color: var(--ink-soft);
  }
  .tabs button[aria-selected="true"] { background: var(--card); border-color: var(--line); border-bottom-color: var(--card); color: var(--ink); font-weight: 600; }
  .panel { padding: 14px; overflow-y: auto; max-height: min(80vh, 900px); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 12px 13px; margin-bottom: 12px; }
  .card h3 { font-size: 14.5px; margin-bottom: 8px; }
  .card h4 { font-size: 13.5px; margin: 10px 0 4px; }
  .card-sub { color: var(--ink-faint); font-size: 12.5px; }
  .edit-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
  .edit-row input { flex: 1; min-width: 0; }
  .edit-row button { max-width: 100%; white-space: normal; }
  .stack { display: flex; flex-direction: column; gap: 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
  .kind { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); color: var(--ink-soft); }
  .type-badge { font-weight: 700; font-size: 11.5px; }
  .prompt-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--card-2); }
  .prompt-q { font-weight: 600; }
  .reference {
    border-left: 3px solid var(--green); background: var(--green-soft); padding: 9px 11px; border-radius: 0 9px 9px 0; margin-top: 9px;
  }
  .reference.criteria { border-left-color: var(--amber); background: var(--amber-soft); }
  .rating-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rating-row button { min-width: 62px; }
  .assist-note { font-size: 12.5px; color: var(--amber); }
  .self-note { font-size: 12.5px; color: var(--red); }
  .attempt { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; font-size: 13.5px; }
  .attempt .meta { color: var(--ink-faint); font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line-strong); margin-right: 4px; }
  .pill.assisted { background: var(--amber-soft); border-color: var(--line-strong); color: var(--amber); }
  .pill.independent { background: var(--green-soft); border-color: var(--line-strong); color: var(--green); }
  .assessment { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px; }
  /* Long attempt/assessment ids and tutor feedback can carry unbreakable tokens;
     wrap them so they cannot widen the right panel (no layout redesign). */
  .assessment-line { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .attempt { min-width: 0; }
  .review-summary { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; min-width: 0; overflow-wrap: anywhere; }
  .empty-hint { color: var(--ink-faint); font-size: 13px; }
  .quality-summary { cursor: pointer; font-weight: 600; }
  .quality-status { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); margin-left: 6px; white-space: nowrap; }
  .q-usable { background: var(--green-soft); color: var(--green); border-color: var(--line-strong); }
  .q-needs { background: var(--amber-soft); color: var(--amber); border-color: var(--line-strong); }
  .q-gap { background: var(--red-soft); color: var(--red); border-color: var(--line-strong); }
  .q-structure { background: var(--card-2); color: var(--ink-soft); }
  .quality-block { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
  .quality-block:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .quality-outcome { font-weight: 600; }
  .quality-meta { font-size: 12px; color: var(--ink-faint); }
  .quality-removed { color: var(--ink-faint); }
  /* Quality cards carry long unbreakable tokens (source URLs, ISO timestamps,
     content fingerprints). "anywhere" breaks them and, unlike "break-word",
     also lowers the card's min-content size, so it cannot widen the panel or
     the 1fr grid track. Scoped to the quality card; other panels keep their
     existing layout and wrapping. */
  .quality-card { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
  .quality-card a { overflow-wrap: anywhere; word-break: break-word; }
  /* Report chips join a concept id with its status, and the shared badge rule
     is nowrap. Inside the quality chips row that must wrap, or a long id would
     reintroduce the min-content blowout the card rule prevents. */
  .quality-card .chips .quality-status { white-space: normal; overflow-wrap: anywhere; }
  .due-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .due-item:last-child { border-bottom: none; }
  .activity-controls label { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
  .activity-controls input[type="range"] { width: 100%; }
  .activity-readout { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px; margin-top: 6px; }
  .activity-readout b { font-variant-numeric: tabular-nums; }
  .grid-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; margin-top: 6px; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .footer { margin-top: 16px; color: var(--ink-faint); font-size: 12.5px; text-align: center; }
  .boot-error { max-width: 720px; margin: 40px auto; padding: 20px; background: var(--red-soft); border: 1px solid var(--line-strong); border-radius: 12px; color: var(--red); }
  .ppv-big { font-size: 26px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }

  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; }
    .graph { height: clamp(320px, 52vh, 520px); }
    .topbar-side { align-items: flex-start; }
    .panel { max-height: none; }
  }
  @media (max-width: 480px) {
    body { font-size: 14px; }
    #app { padding: 8px 8px 28px; }
    .panel { padding: 10px; }
    .tabs button { padding: 7px 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
/*__FORGE_PRESENTATION__*/
</style>
</head>
<body>
<noscript><div class="boot-error">这个学习页需要 JavaScript 才能显示图谱、练习与保存状态。</div></noscript>
<script id="ember-data" type="application/json">__EMBER_PAYLOAD__</script>

<div id="bootError" class="boot-error" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">forge · 锻造</div>
      <h1 id="docTitle"></h1>
      <p id="docGoal"></p>
    </div>
    <div class="topbar-side">
      <span id="modeBadge" class="badge"></span>
      <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
      <div class="io-actions">
        <button id="exportBtn" type="button">导出状态</button>
        <button id="importBtn" type="button">导入状态</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </header>

  <div id="reloadBanner" class="banner banner-warn" hidden></div>
  <div id="storageBanner" class="banner banner-warn" hidden></div>
  <div id="conflictBanner" class="banner banner-error" hidden></div>
  <div id="importBanner" class="banner banner-error" hidden></div>

  <div class="layout">
    <section class="graph-pane" aria-label="知识图谱与关系">
      <div class="graph-toolbar" role="toolbar" aria-label="图谱操作">
        <button type="button" data-act="fit">适配视图</button>
        <button type="button" data-act="zoom-in">放大</button>
        <button type="button" data-act="zoom-out">缩小</button>
        <button type="button" data-act="focus">聚焦选中</button>
        <button type="button" data-act="overview">返回总览</button>
        <button type="button" data-act="expand">展开全部</button>
        <button type="button" data-act="collapse">折叠到一级</button>
        <label class="toggle"><input type="checkbox" id="relLabels"> 显示关系标签</label>
      </div>
      <div id="graph" class="graph" tabindex="0" role="application"
           aria-label="可缩放的知识图谱：方向键平移，加号减号缩放，F 适配视图">
        <div id="graphStage" class="graph-stage">
          <div id="graphCanvas" class="graph-canvas">
            <svg id="edgeSvg" class="edge-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
            <div id="nodeLayer" class="node-layer"></div>
            <div id="relLabelLayer" class="rel-label-layer"></div>
          </div>
        </div>
        <div id="graphEmpty" class="graph-empty" hidden>暂无概念</div>
      </div>
      <div id="legend" class="legend" aria-label="图例"></div>
    </section>

    <aside class="side-pane" aria-label="学习面板">
      <nav id="tabs" class="tabs" role="tablist" aria-label="学习视图"></nav>
      <div id="panel" class="panel" role="tabpanel" tabindex="0"></div>
    </aside>
  </div>

  <footer class="footer">
    <span id="footerNote"></span>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /*__EMBER_ROUND_LIBRARY__*/
  /*__EMBER_SCHEDULE_LIBRARY__*/
  /*__EMBER_TUTOR_REVIEW_LIBRARY__*/
  /*__EMBER_INTERACTIONS_LIBRARY__*/
  /*__EMBER_INSIGHTS_LIBRARY__*/
  /*__EMBER_CORRECTIONS_LIBRARY__*/

  // ---------------------------------------------------------------------------
  // Small DOM and utility helpers (all learner/model text goes through
  // textContent or setAttribute; never innerHTML).
  // ---------------------------------------------------------------------------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function clearNode(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function h(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = String(v);
        else if (k === 'dataset') { Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; }); }
        else if (k === 'style' && typeof v === 'object') { Object.keys(v).forEach(function (s) { node.style[s] = v[s]; }); }
        else if (k === 'value' && (tag === 'input' || tag === 'textarea' || tag === 'select')) node.value = String(v);
        else if (k === 'checked' && tag === 'input') { if (v) node.checked = true; }
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else if (v === true) node.setAttribute(k, '');
        else node.setAttribute(k, String(v));
      });
    }
    appendChildren(node, children);
    return node;
  }
  function appendChildren(node, children) {
    if (children === null || children === undefined || children === false) return;
    if (Array.isArray(children)) { children.forEach(function (c) { appendChildren(node, c); }); return; }
    if (typeof children === 'string' || typeof children === 'number') { node.appendChild(document.createTextNode(String(children))); return; }
    if (children instanceof Node) node.appendChild(children);
  }
  function svgEl(tag, attrs, children) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        node.setAttribute(k, String(v));
      });
    }
    appendChildren(node, children);
    return node;
  }
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function nowIso() { return new Date().toISOString(); }
  function addDaysIso(iso, days) { var d = new Date(iso); return new Date(d.getTime() + days * 86400000).toISOString(); }
  function escSel(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'); }

  var _measureCanvas = document.createElement('canvas');
  var _measureCtx = _measureCanvas.getContext('2d');
  function textWidth(text, font) {
    _measureCtx.font = font || '13px system-ui, sans-serif';
    return _measureCtx.measureText(String(text)).width;
  }

  // ---------------------------------------------------------------------------
  // Payload
  // ---------------------------------------------------------------------------
  var payload = null;
  try {
    payload = JSON.parse($('#ember-data').textContent);
  } catch (err) {
    showBootError('无法解析内嵌的学习数据：' + err.message);
    return;
  }
  if (!payload || typeof payload !== 'object' || !payload.model || !Array.isArray(payload.model.concepts)) {
    showBootError('内嵌数据缺少 model.concepts，无法渲染学习页。');
    return;
  }
  function showBootError(message) {
    var box = $('#bootError');
    box.hidden = false;
    box.textContent = message;
    var app = $('#app');
    if (app) app.hidden = true;
  }

  // ---------------------------------------------------------------------------
  // Model indexing
  // ---------------------------------------------------------------------------
  var model = payload.model;
  var concepts = Array.isArray(model.concepts) ? model.concepts : [];
  var relations = Array.isArray(model.relations) ? model.relations : [];
  var prompts = Array.isArray(model.prompts) ? model.prompts : [];

  // ---------------------------------------------------------------------------
  // View computation (mirrors core stateView: self-rating never creates mastery)
  // ---------------------------------------------------------------------------
  function computeView() {
    var conceptStatus = {};
    App.concepts.forEach(function (concept) {
      var evidence = App.state.conceptEvidence[concept.id];
      var active = isConceptEvidenceActive(concept.id, evidence);
      var hasStatus = evidence && typeof evidence === 'object' && evidence.status && evidence.status !== 'unknown';
      var promptIds = App.prompts.filter(function (p) { return p.conceptId === concept.id; }).map(function (p) { return p.id; });
      var ownIds = Object.keys(App.state.ownQuestions)
        .filter(function (id) { return App.state.ownQuestions[id].conceptId === concept.id; })
        .filter(function (id) { return !App.prompts.some(function (p) { return p.id === id; }); });
      var activeAttempts = promptIds.concat(ownIds).reduce(function (acc, id) { return acc.concat(activeAttemptsFor(id)); }, []);
      if (hasStatus && active) {
        conceptStatus[concept.id] = {
          status: evidence.status, source: 'tutor', note: evidence.note, at: evidence.at,
          attemptIds: evidence.attemptIds || []
        };
      } else if (hasStatus) {
        conceptStatus[concept.id] = {
          status: 'unknown', source: null,
          note: '概念内容已更新，原有导师证据失效，需要重新作答后再复核',
          at: evidence.at, staleEvidence: { status: evidence.status, note: evidence.note, at: evidence.at }
        };
      } else if (activeAttempts.length > 0) {
        conceptStatus[concept.id] = {
          status: 'pending-review', source: 'learner', note: '有作答记录，等待复核',
          at: activeAttempts[activeAttempts.length - 1].at, attempts: activeAttempts.length
        };
      } else {
        conceptStatus[concept.id] = { status: 'unknown', source: null, note: '尚无证据', at: null };
      }
    });
    var viewPrompts = {};
    var allPrompts = App.prompts.concat(Object.keys(App.state.ownQuestions)
      .filter(function (id) {
        var q = App.state.ownQuestions[id];
        return App.byId.has(q.conceptId) && !App.prompts.some(function (p) { return p.id === id; });
      })
      .map(function (id) {
        var q = App.state.ownQuestions[id];
        return { id: q.id, conceptId: q.conceptId, kind: 'recall', question: q.text, answer: '', criteria: [], origin: 'learner' };
      }));
    allPrompts.forEach(function (p) {
      var attempts = App.state.attempts[p.id] || [];
      var rawEvidence = App.state.promptEvidence[p.id] || null;
      var hasStatus = rawEvidence && typeof rawEvidence === 'object' && rawEvidence.status && rawEvidence.status !== 'unknown';
      var evidenceActive = hasStatus && isPromptEvidenceActive(p.id, rawEvidence);
      viewPrompts[p.id] = {
        id: p.id, conceptId: p.conceptId, origin: p.origin || 'model',
        attempts: attempts.length,
        lastAttempt: attempts.length ? attempts[attempts.length - 1] : null,
        schedule: App.state.schedules[p.id] || null,
        evidence: evidenceActive ? rawEvidence : null,
        staleEvidence: hasStatus && !evidenceActive ? rawEvidence : null,
        stale: isPromptStale(p.id)
      };
    });
    return { conceptStatus: conceptStatus, prompts: viewPrompts };
  }

  // ---------------------------------------------------------------------------
  // API / save queue

  function apiPath(type) {

  }
  function makeBody(action) {

    else if (action.type === 'interaction') { input.interactionId = action.interactionId; input.stepId = action.stepId; input.source = 'browser'; }
    else if (action.type === 'note') { input.conceptId = action.conceptId; input.kind = action.kind; input.text = action.text; }
    else if (action.type === 'title') { input.conceptId = action.conceptId; input.title = action.title; }
    else if (action.type === 'relation') { input.relationId = action.relationId; input.label = action.label; }
    else if (action.type === 'question') { input.conceptId = action.conceptId; input.text = action.text; input.id = action.id; }
    else if (action.type === 'practice' || action.type === 'submit' || action.type === 'assessment' || action.type === 'correction') {
      ['promptId', 'sessionId', 'draft', 'baseDraft', 'assistance', 'hintLevel', 'attemptId', 'answer', 'assisted', 'rating', 'correctionId', 'text', 'roundId', 'taskId'].forEach(function (key) {
        if (action[key] !== undefined) input[key] = action[key];
      });
      if (action.assessmentId !== undefined) input.assessmentId = action.assessmentId;
      if (action.targetCorrectionId !== undefined) input.targetCorrectionId = action.targetCorrectionId;
    }
    else if (action.type === 'attempt') {
      input.promptId = action.promptId; input.attemptId = action.attemptId; input.answer = action.answer;
      input.rating = action.rating; input.assisted = !!action.assisted; input.source = 'browser';
      if (action.fingerprint) input.fingerprint = action.fingerprint;
    }
    else if (action.type === 'import') { input.state = action.state; }
    return Object.assign({
      revision: action.revision === undefined ? App.state.revision : action.revision,
      modelFingerprint: App.modelFingerprint

  }
  function sendAction(action) {

      catch (err) { return Promise.reject(err); }
    }

      method: 'POST',

      var session = (App.state.practiceSessions || {})[action.sessionId];

      if (binding.roundId) { action.roundId = binding.roundId; action.taskId = binding.taskId; }

  function pump() {
    if (App.running) return Promise.resolve();

    function step() {

      }

      return sendAction(action).then(function (result) {
        if (result.cacheFailure) {
          setSave('error', '尚未保存到本机缓存；输入保留，可重试');
          App.running = false; render(); return;
        }
        if (result.ok) {
          if (!applyServerData(result.data)) { App.running = false; render(); return; }
          App.queue.shift();
          acknowledgeAction(action);
          clearDraftForAction(action);
          setSaved();
          if (action.type === 'attempt' || action.type === 'submit' || action.type === 'assessment') refreshDue();
          return step();
        }
        var data = result.data || {};
        if (!applyServerData(data)) { App.running = false; render(); return; }
        var decision = resolveConflict(action, data.state || App.state);
        if (decision === 'ack') {
          App.queue.shift();
          acknowledgeAction(action);
          clearDraftForAction(action);
          setSaved('此前已写入');
          return step();
        }
        if (decision === 'replay') {
          if (action._force) return step();
          action._retries = (action._retries || 0) + 1;

      // assessed arrangement is due: both facts stay visible.
      var latest = attempts.length ? attempts[attempts.length - 1] : null;
      var latestAssessment = latest ? effectiveAssessment(latest) : null;
      if (schedule && new Date(schedule.dueAt).getTime() <= atMs) {
        due.push({
          promptId: promptId, conceptId: prompt.conceptId, origin: prompt.origin,
          intervalDays: schedule.intervalDays, lastRating: schedule.lastRating,
          lastAt: schedule.lastAt, dueAt: schedule.dueAt, assisted: !!schedule.assisted,
          assessmentSource: schedule.assessmentSource || null,

      ]));

      if (supplement.readAt) meta.push('核对时间：' + supplement.readAt);
      if (meta.length) item.appendChild(h('div', { class: 'card-sub' }, meta.join(' · ')));
      var linkUrl = safeHttpUrl(supplement.access) || safeHttpUrl(supplement.sourceUrl);
      item.appendChild(h('div', {}, qualityExternalLink(linkUrl, supplement.access || supplement.sourceUrl)));
      if (supplement.note) item.appendChild(h('div', { class: 'card-sub' }, supplement.note));
      item.appendChild(h('div', { class: 'quality-meta' },
        supplement.countedAsCoverage ? '已实际读取并计入覆盖' : '未计入覆盖（未读取、范围或来源不完整）'));

    });

  }
  function qualityGapList(record) {
    var gaps = Array.isArray(record.gaps) ? record.gaps : [];
    if (!gaps.length) return h('p', { class: 'empty-hint' }, '没有登记的缺口。');
    var ul = h('ul', { style: { paddingLeft: '18px', margin: '0' } });
    gaps.forEach(function (gap) {
      var effect = QUALITY_GAP_EFFECT[gap.effect] || gap.effect || '';
      var parts = [h('strong', {}, gap.text || '未命名缺口')];
      if (effect) parts.push(' · ' + effect);
      if (gap.dimension) parts.push('（' + (QUALITY_DIMENSION[gap.dimension] || gap.dimension) + '）');
      if (gap.outcomeEffect) parts.push('：' + gap.outcomeEffect);
      ul.appendChild(h('li', {}, parts));
    });
    return ul;
  }
  function qualityStaleList(reasons) {
    var list = Array.isArray(reasons) ? reasons.filter(Boolean) : [];
    if (!list.length) return null;
    var ul = h('ul', { style: { paddingLeft: '18px', margin: '0' } });
    list.forEach(function (reason) { ul.appendChild(h('li', {}, reason)); });
    return h('div', {}, [h('strong', {}, '需要重新核对：'), ul]);
  }
  // One goal-specific record. A concept can support several goals, and each
  // record keeps its own outcome and scope version, so they are never merged.
  function qualityRecordBlock(goal, record) {
    var box = h('div', { class: 'quality-block' });
    var status = record.role === null || record.role === undefined ? null : record.status;
    box.appendChild(h('div', {}, [
      h('span', { class: 'quality-status ' + qualityStatusClass(status) }, qualityStatusText(status)),
      record.role ? h('span', { class: 'quality-meta' }, ' ' + (QUALITY_ROLE[record.role] || record.role)) : null
    ]));
    if (record.inCurrentModel === false) {
      box.appendChild(h('p', { class: 'quality-removed' }, '此概念已不在当前模型或导图中，以下仅为历史记录。'));
    }
    var outcome = goal ? goal.outcome : record.outcome;
    if (outcome) box.appendChild(qualityDetailRow('原始成果', outcome));
    if (goal && goal.stale) {
      box.appendChild(h('p', { class: 'self-note' }, '记录已失效：目标或内容已更新，不能按当前通过处理。'));
    } else if (goal && goal.passed) {
      box.appendChild(h('p', { class: 'quality-meta' }, '作者结论：在本记录范围内通过。'));
    } else if (goal) {
      box.appendChild(h('p', { class: 'quality-meta' }, '作者结论：本记录范围内尚未通过。'));
    } else if (record.passed === true) {
      box.appendChild(h('p', { class: 'quality-meta' }, '作者结论：在本记录范围内通过。'));
    }
    if (goal) {
      var version = goal.scope && goal.scope.modelFingerprint
        ? goal.scope.modelFingerprint.slice(0, 12) : '（未记录）';
      var scopeLine = '内容版本 ' + version + (goal.recordedAt ? ' · 记录于 ' + goal.recordedAt : '');
      box.appendChild(h('p', { class: 'quality-meta' }, '记录范围：' + scopeLine));
      if (outcome && model.goal && outcome !== model.goal) {
        box.appendChild(qualityDetailRow('当前学习目标（已更新）', model.goal));
      }
    }
    var stale = qualityStaleList((record.staleReasons && record.staleReasons.length ? record.staleReasons : null));
    if (stale) box.appendChild(stale);

    var evidence = h('details', { class: 'quality-block' });
    evidence.appendChild(h('summary', { class: 'quality-summary' }, '展开依据、来源与局限'));
    evidence.appendChild(h('h4', {}, '检查维度与依据'));
    evidence.appendChild(qualityDimensionList(record));
    evidence.appendChild(h('h4', {}, '补充来源与核对范围'));
    evidence.appendChild(qualitySupplementList(record));
    evidence.appendChild(h('h4', {}, '缺口与对成果的影响'));
    evidence.appendChild(qualityGapList(record));
    if (Array.isArray(record.limitations) && record.limitations.length) {
      evidence.appendChild(h('h4', {}, '记录声明的局限'));
      var lim = h('ul', { style: { paddingLeft: '18px', margin: '0' } });
      record.limitations.forEach(function (line) { lim.appendChild(h('li', {}, line)); });
      evidence.appendChild(lim);
    }
    box.appendChild(evidence);
    return box;
  }
  function renderConceptQuality(id) {

  // Report-level view: every recorded goal and its concepts, including concepts
  // that have since left the model. Historical records are shown as history and
  // never re-labelled with a current pass.
  function renderQualityHistory() {
    var sections = [];
    if (!qualityPresent()) {
      var notReviewed = section('内容质检', [
        h('p', { class: 'empty-hint' }, QUALITY_NOT_REVIEWED),
        h('p', { class: 'card-sub' }, QUALITY_SEMANTICS_NOTE)
      ]);
      notReviewed.classList.add('quality-card');
      return [notReviewed];
    }
    var q = App.quality;
    var bodies = [];
    if (q.stale) {
      bodies.push(h('p', { class: 'self-note' }, '这份质检报告已失效：目标或内容已更新，结论只对原记录范围有效。'));
      var globalReasons = qualityStaleList(q.staleReasons);
      if (globalReasons) bodies.push(globalReasons);
    } else {
      bodies.push(h('p', { class: 'card-sub' }, '记录范围与当前内容一致。'));
    }
    bodies.push(h('p', { class: 'card-sub' }, QUALITY_SEMANTICS_NOTE));
    (q.goals || []).forEach(function (goal) {
      var goalBox = h('div', { class: 'quality-block' });
      goalBox.appendChild(h('div', {}, [
        h('span', { class: 'quality-status ' + qualityStatusClass(goal.status) }, qualityStatusText(goal.status)),
        h('span', { class: 'quality-outcome' }, ' ' + (goal.outcome || '（未记录成果）'))
      ]));
      var version = goal.scope && goal.scope.modelFingerprint
        ? goal.scope.modelFingerprint.slice(0, 12) : '（未记录）';
      goalBox.appendChild(h('p', { class: 'quality-meta' },
        '记录内容版本 ' + version + (goal.recordedAt ? ' · 记录于 ' + goal.recordedAt : '')));
      var chips = h('div', { class: 'chips' });
      (goal.concepts || []).forEach(function (record) {
        chips.appendChild(h('span', { class: 'quality-status ' + qualityStatusClass(record.status) },
          record.id + '：' + qualityStatusText(record.status) + (record.inCurrentModel === false ? '（已移除）' : '')));
      });
      if (chips.childNodes.length || chips.children.length) goalBox.appendChild(chips);
      var goalStale = qualityStaleList(goal.staleReasons);
      if (goalStale) goalBox.appendChild(goalStale);
      bodies.push(goalBox);
    });
    var report = section('内容质检报告', bodies);
    report.classList.add('quality-card');
    sections.push(report);

    // Concepts named by the record but no longer present in the model or graph.
    // They are read from the per-goal arrays and, during the flat-map
    // transition, from the summary map so a removed concept is never lost.
    var removed = [];
    var removedIds = {};
    function addRemoved(goal, record) {
      if (record.inCurrentModel !== false || removedIds[record.id]) return;
      removedIds[record.id] = true;
      removed.push({ goal: goal, record: record });
    }
    (q.goals || []).forEach(function (goal) {
      (goal.concepts || []).forEach(function (record) { addRemoved(goal, record); });
    });
    Object.keys(q.concepts || {}).forEach(function (id) { addRemoved(null, q.concepts[id]); });
    if (removed.length) {
      var history = h('div', { class: 'stack' });
      history.appendChild(h('p', { class: 'card-sub' }, '以下概念已不在当前模型或导图中，仅保留当时的历史结论，不代表当前内容。'));
      removed.forEach(function (entry) {
        var box = h('details', { class: 'prompt-item' });
        box.appendChild(h('summary', { class: 'quality-summary' },
          entry.record.id + '：' + qualityStatusText(entry.record.status) + '（历史）'));
        box.appendChild(qualityRecordBlock(entry.goal, entry.record));
        history.appendChild(box);
      });
      var historySection = section('已移除概念的历史质检', history);
      historySection.classList.add('quality-card');
      sections.push(historySection);
    }
    return sections;
  }

  // ----- concept panel -------------------------------------------------------
  function noteEditor(conceptId, kind, titleText) {
    var key = 'note:' + conceptId + ':' + kind;
    var current = kind === 'explanation' ? App.state.explanations[conceptId] : App.state.summaries[conceptId];
    var draft = getDraft(key);
    var area = h('textarea', {
      rows: '4', id: 'note-' + conceptId + '-' + kind, 'data-draft-key': key,
      'aria-label': titleText, placeholder: kind === 'explanation' ? '用自己的话解释这个概念……' : '写一句这次学到的总结或反思……'
    });
    area.value = draft !== null ? draft : (current ? current.text : '');
    area.addEventListener('input', function () { setDraft(key, area.value); });
    var status = h('span', { class: 'card-sub' });
    var btn = h('button', {
      type: 'button', class: 'primary', onclick: function () {
        var text = area.value.trim();
        if (!text) { status.textContent = '内容不能为空'; return; }
        if (current && text === current.text) { status.textContent = '与已保存内容相同'; return; }
        status.textContent = '';
        enqueue({ type: 'note', conceptId: conceptId, kind: kind, text: text, base: current ? current.text : '' });
        setSave('saving', '笔记排队保存…');
      }
    }, '保存' + (kind === 'explanation' ? '自己的解释' : '总结'));
    return h('div', { class: 'stack' }, [area, h('div', { class: 'edit-row' }, [btn, status])]);
  }
  function questionEditor(conceptId) {
    var key = 'question:' + conceptId;
    var draft = getDraft(key);
    var area = h('textarea', { rows: '2', id: 'question-' + conceptId, 'data-draft-key': key, 'aria-label': '自创检索问题', placeholder: '写一个以后可以藏起参考、自我检索的问题……' });
    area.value = draft !== null ? draft : '';
    area.addEventListener('input', function () { setDraft(key, area.value); });
    var status = h('span', { class: 'card-sub' });
    area.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); btn.click(); }
    });
    var btn = h('button', {
      type: 'button', class: 'primary', onclick: function () {
        var text = area.value.trim();
        if (!text) { status.textContent = '问题不能为空'; return; }
        var at = nowIso();
        status.textContent = '正在计算问题指纹…';
        makeOwnQuestionId(conceptId, text, at).then(function (id) {
          return learnerFingerprint(conceptId, text).then(function (fp) {
            setOwnFingerprint(id, fp, conceptId);
            enqueue({ type: 'question', conceptId: conceptId, text: text, id: id, createdAt: at });
            status.textContent = '';
          });
        }).catch(function (err) { status.textContent = err.message; });
      }
    }, '保存自创问题');
    return h('div', { class: 'stack' }, [area, h('div', { class: 'edit-row' }, [btn, status])]);
  }
  function renderConceptPanel() {

      promptBox.appendChild(h('button', {

    // sources tied to this concept

    // never writes learner state; the main study actions above stay visible.
    frag.appendChild(renderConceptQuality(id));
    return frag;

  // ----- teaching interactions (comparison) ----------------------------------
  // Configuration and read model come from the inlined interactions library, so
  // the page never re-implements a knowledge rule: the same
  // `interactionForConcept` / `interactionComparisonView` the backend imports.
  // Choosing a comparison is observation only — it writes no answer, rating,
  // hint or mastery evidence. All author text goes through text nodes.
  function interactionSelectionFor(interactionId) {
    if (!App.interactionSelection) App.interactionSelection = {};
    if (!App.interactionSelection[interactionId]) App.interactionSelection[interactionId] = {};
    return App.interactionSelection[interactionId];
  }
  function interactionObjectSelect(interaction, view, slot) {
    var selectedId = slot === 'a' ? view.selection.objectAId : view.selection.objectBId;
    var sel = h('select', { id: 'interaction-' + interaction.id + '-' + slot, 'aria-label': slot === 'a' ? '比较对象 A' : '比较对象 B' });
    view.objects.forEach(function (obj) {
      sel.appendChild(h('option', { value: obj.id, selected: obj.id === selectedId }, obj.label));
    });
    sel.value = selectedId;
    sel.addEventListener('change', function () {
      var state = interactionSelectionFor(interaction.id);
      if (slot === 'a') state.objectAId = sel.value; else state.objectBId = sel.value;
      render();
    });
    return sel;
  }
  function interactionDimensionSelect(interaction, view) {
    var sel = h('select', { id: 'interaction-' + interaction.id + '-dimension', 'aria-label': '比较维度' });
    view.dimensions.forEach(function (dim) {
      sel.appendChild(h('option', { value: dim.id, selected: dim.id === view.selection.dimensionId }, dim.label));
    });
    sel.value = view.selection.dimensionId;
    sel.addEventListener('change', function () {
      interactionSelectionFor(interaction.id).dimensionId = sel.value;
      render();
    });
    return sel;
  }
  function renderInteractionsPanel(id) {
    var box = h('div', { class: 'stack' });
    var list = interactionForConcept(roundModel(), id);
    if (!list.length) {
      // Unconfigured is stated plainly and never implies the component was
      // reviewed or that a comparison exists.
      box.appendChild(h('p', { class: 'empty-hint' }, '本概念尚未配置互动组件；这里不表示互动内容已经过核对。'));
      return section('对照与互动', box);
    }
    list.forEach(function (interaction) {
      if (interaction.kind === 'step-through') {
        box.appendChild(renderStepInteraction(interaction));
        return;
      }
      if (interaction.kind === 'parameter') {
        box.appendChild(renderParameterInteraction(interaction));
        return;
      }
      var view = interactionComparisonView(interaction, interactionSelectionFor(interaction.id));

  function freshPractice(binding) {
    return Object.assign({
      sessionId: 'practice-' + crypto.randomUUID(), submitted: false, pendingSubmit: false,
      peeked: false, referenceVisible: false, hintLevel: 0,
      rated: false, pendingRating: null, pendingAttemptId: null, answer: '', draft: ''

  }
  function getPractice(promptId) {
    var binding = routeBinding(promptId);
    var existingPractice = App.practice[promptId];
    if (existingPractice && (existingPractice.roundId !== binding.roundId || existingPractice.taskId !== binding.taskId)) delete App.practice[promptId];
    if (!App.practice[promptId]) {
      var sessions = Object.values(App.state.practiceSessions || {}).filter(function (s) {
        return s.promptId === promptId && s.fingerprint === currentPromptFingerprint(promptId) &&
          s.roundId === binding.roundId && s.taskId === binding.taskId;
      }).sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      var saved = sessions[0];
      var p = freshPractice(binding);
      if (saved) {
        p.sessionId = saved.id; p.draft = saved.draft;
        p.peeked = saved.assistance.length > 0;
        p.hintLevel = saved.hintLevel || 0;
        // A previous explicit reveal remains recorded, but reference starts hidden on reopen.
        var original = (App.state.attempts[promptId] || []).find(function (a) { return a.id === saved.attemptId; });
        if (original) { p.answer = original.answer; p.submitted = true; p.pendingAttemptId = original.id; p.rated = original.rating !== null; }
      } else p.draft = binding.roundId ? '' : getDraft('practice:' + promptId) || '';
      App.practice[promptId] = p;
    }
    var practice = App.practice[promptId];
    var session = (App.state.practiceSessions || {})[practice.sessionId];
    var original = (App.state.attempts[promptId] || []).find(function (a) { return a.id === practice.pendingAttemptId; });
    // Refresh/replay can add help to an already-open draft. Once submitted,
    // the immutable original decides classification, even if help is shown later.
    if (original) practice.peeked = !!original.assisted;

  function savePracticeDraft(promptId, value) {

  }
  function submitPractice(promptId, value) {

    if (p.draft !== value) savePracticeDraft(promptId, value);
    if (!Object.prototype.hasOwnProperty.call(App.state.practiceSessions, p.sessionId) && !App.queue.some(function (a) { return a.type === 'practice' && a.sessionId === p.sessionId; })) {
      enqueue({ type: 'practice', promptId: promptId, sessionId: p.sessionId, draft: value, baseDraft: '' });
    }
    p.answer = value; p.pendingSubmit = true;
    p.pendingAttemptId = p.pendingAttemptId || 'att-' + crypto.randomUUID();
    var assistance = p.peeked ? ['reference'] : [];
    var session = Object.prototype.hasOwnProperty.call(App.state.practiceSessions, p.sessionId) ? App.state.practiceSessions[p.sessionId] : null;
    if (session) assistance = session.assistance.slice();
    App.queue.forEach(function (a) { if (a.type === 'practice' && a.sessionId === p.sessionId) assistance = assistance.concat(a.assistance || []); });
    assistance = Array.from(new Set(assistance)).sort();
    enqueue({ type: 'submit', promptId: promptId, sessionId: p.sessionId,
      attemptId: p.pendingAttemptId, answer: value, assisted: assistance.length > 0, assistance: assistance });
    render();
  }

  function fmtDate(iso) { return iso ? new Date(iso).toLocaleString('zh-CN') : '—'; }
  // The review-date block states the full time, its source and the exact answer

        deferred ? h('p', { class: 'assist-note' }, item.deferredReason || '暂缓续接，原到期状态不变。') : null,

  // ----- material map (author reading scope inside the quality record) --------
  // The page only renders the derived view the CLI produced. It never re-derives
  // the reading scope or the stale reasons, so the panel and `quality-read`
  // cannot drift apart. A map is an author claim, not proof that anything was
  // read, and it never changes mastery.
  var MATERIAL_MAP_VERSION_UNKNOWN = '版本未知（未取得稳定版本标识）';
  var MATERIAL_MAP_NOTE = '材料地图只记录作者声明的阅读范围与未读部分；字段齐全不等于材料已被读懂，也不改变掌握度。';
  var MATERIAL_MAP_EMPTY_COVERAGE = '地图还没有声明任何已核对范围：阅读范围未知，工具不会把未核对内容记作已核对。';
  var MATERIAL_MAP_ABSENT = '这份学习页没有材料地图。';

  function materialMapList(lines, emptyText) {
    var list = Array.isArray(lines) ? lines.filter(function (line) { return line !== ''; }) : [];
    if (!list.length) return h('p', { class: 'empty-hint' }, emptyText);
    var ul = h('ul', { style: { paddingLeft: '18px', margin: '0' } });
    list.forEach(function (line) { ul.appendChild(h('li', {}, line)); });
    return ul;
  }
  function materialMapMeta(label, value) {
    return h('p', { class: 'quality-meta' }, [h('strong', {}, label + '：'), value]);
  }
  function materialMapSourceCard(source) {
    var card = h('div', { class: 'prompt-item' });
    card.appendChild(h('div', { class: 'prompt-q' }, [
      source.sourceTitle || source.sourceId || '未命名来源',
      h('span', { class: 'quality-status ' + (source.declared ? (source.stale ? 'q-gap' : 'q-structure') : 'q-gap') },
        source.declared ? (source.stale ? '需要重新核对' : (source.coverageKnown ? '已记录' : '范围未知')) : '未记录')
    ]));
    var meta = [];
    if (source.sourceKind) meta.push(source.sourceKind);
    if (source.sourceNote) meta.push(source.sourceNote);
    if (meta.length) card.appendChild(h('div', { class: 'card-sub' }, meta.join(' · ')));
    if (source.sourceUrl) {
      var safeSourceUrl = safeHttpUrl(source.sourceUrl);
      card.appendChild(h('div', {}, safeSourceUrl
        ? h('a', { href: safeSourceUrl, target: '_blank', rel: 'noopener noreferrer' }, source.sourceUrl)
        : h('span', { class: 'quality-meta' }, source.sourceUrl)));
    }
    if (!source.declared) {
      card.appendChild(h('p', { class: 'self-note' }, source.unknownReason || '未包含在材料地图记录中，阅读范围未知。'));
      return card;
    }
    if (source.inCurrentModel === false) {
      card.appendChild(h('p', { class: 'quality-removed' }, '此来源已不在当前模型中，以下仅为历史记录。'));
    }
    card.appendChild(h('p', { class: 'quality-meta' },
      '版本：' + (source.versionKnown ? source.version : MATERIAL_MAP_VERSION_UNKNOWN)));
    var stale = qualityStaleList(source.staleReasons);
    if (stale) card.appendChild(stale);
    card.appendChild(h('h4', {}, '结构'));
    card.appendChild(materialMapList(source.structure, '没有记录结构。'));
    card.appendChild(h('h4', {}, '目标对应范围'));
    var scope = Array.isArray(source.goalScope) ? source.goalScope : [];
    if (!scope.length) card.appendChild(h('p', { class: 'empty-hint' }, '没有记录目标对应范围。'));
    else {
      var scopeList = h('ul', { style: { paddingLeft: '18px', margin: '0' } });
      scope.forEach(function (item) {
        var line = (item.conceptTitle || item.conceptId || '（缺少概念 id）') +
          (item.conceptTitle && item.conceptId ? '（' + item.conceptId + '）' : '') + '：' + item.range;
        var entry = h('li', {}, line);
        if (item.stale) {
          entry.appendChild(h('div', { class: 'quality-meta' },
            (item.staleReasons && item.staleReasons.length ? item.staleReasons.join('；') : '需要重新核对')));
        }
        scopeList.appendChild(entry);
      });
      card.appendChild(scopeList);
    }
    card.appendChild(h('h4', {}, '已核对范围与依据'));
    var checked = Array.isArray(source.checked) ? source.checked : [];
    if (!checked.length) card.appendChild(h('p', { class: 'empty-hint' }, MATERIAL_MAP_EMPTY_COVERAGE));
    else {
      var checkedList = h('ul', { style: { paddingLeft: '18px', margin: '0' } });
      checked.forEach(function (item) {
        checkedList.appendChild(h('li', {}, [
          h('strong', {}, item.range || '（范围未写明）'),
          item.basis ? '：' + item.basis : '',

        ]));
      });
      card.appendChild(checkedList);
    }
    card.appendChild(h('h4', {}, '未读部分'));
    card.appendChild(materialMapList(source.unread, '没有记录未读部分。'));
    card.appendChild(h('h4', {}, '缺口与影响'));
    var gaps = Array.isArray(source.gaps) ? source.gaps : [];
    if (!gaps.length) card.appendChild(h('p', { class: 'empty-hint' }, '没有登记缺口。'));
    else {
      var gapList = h('ul', { style: { paddingLeft: '18px', margin: '0' } });
      gaps.forEach(function (gap) {
        gapList.appendChild(h('li', {}, [
          h('strong', {}, gap.range || '（范围未写明）'),
          ' · ' + (QUALITY_GAP_EFFECT[gap.effect] || gap.effect || '影响未说明'),
          gap.reason ? '：' + gap.reason : ''
        ]));
      });
      card.appendChild(gapList);
    }
    return card;
  }
  function renderMaterialMap() {

  // ----- activity (only when model.activity === "bayes-frequency") -----------
  var activityState = { prior: 0.01, sens: 0.9, spec: 0.95, N: 1000 };
  function activityExpected() {
    var N = activityState.N;
    var diseased = N * activityState.prior;
    var healthy = N - diseased;
    var tp = diseased * activityState.sens;
    var fn = diseased * (1 - activityState.sens);
    var fp = healthy * (1 - activityState.spec);
    var tn = healthy * activityState.spec;
    var positives = tp + fp;
    return {
      N: N, diseased: diseased, healthy: healthy,
      tp: tp, fn: fn, fp: fp, tn: tn,
      positives: positives,
      ppv: positives > 0 ? tp / positives : null
    };
  }
  // PPV uses exact expected frequencies. The canvas separately rounds each
  // category to integers while keeping exactly N cells (largest remainder).
  function roundCellsToTotal(expected) {
    var raw = [expected.tp, expected.fp, expected.fn, expected.tn];
    var cells = raw.map(function (v) { return Math.floor(v); });
    var assigned = cells.reduce(function (a, b) { return a + b; }, 0);
    var remainder = expected.N - assigned;
    var byFraction = raw.map(function (v, i) { return { i: i, frac: v - Math.floor(v) }; })
      .sort(function (a, b) { return b.frac - a.frac || a.i - b.i; });
    for (var k = 0; k < remainder; k++) cells[byFraction[k % byFraction.length].i] += 1;
    return { tp: cells[0], fp: cells[1], fn: cells[2], tn: cells[3] };
  }
  function computeActivityResults() {
    var expected = activityExpected();
    return { expected: expected, cells: roundCellsToTotal(expected), ppv: expected.ppv };
  }
  function fmtCount(v) {
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v * 1000) / 1000);
  }
  function ppvText(ppv) {
    if (ppv === null || ppv === undefined) return '无法定义（没有阳性）';
    return (ppv * 100).toFixed(1) + '%';
  }
  function drawActivity(canvas) {
    var res = computeActivityResults();
    var cells = res.cells;
    var cols = 40;
    var rows = Math.ceil(activityState.N / cols);
    var cell = 12;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cols * cell * dpr;
    canvas.height = rows * cell * dpr;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cols * cell, rows * cell);

    function fillCell(index, color) {
      var x = (index % cols) * cell;
      var y = Math.floor(index / cols) * cell;
      ctx.fillStyle = color;
      ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
    }
    var colors = { tp: '#2f6b45', fp: '#d98f2b', fn: '#b0533c', tn: '#e7ddca' };
    var index = 0;
    var i;
    for (i = 0; i < cells.tp; i++) fillCell(index++, colors.tp);
    for (i = 0; i < cells.fp; i++) fillCell(index++, colors.fp);
    for (i = 0; i < cells.fn; i++) fillCell(index++, colors.fn);
    for (i = 0; i < cells.tn; i++) fillCell(index++, colors.tn);
    return res;
  }
  function formatActivityResults(res) {
    var e = res.expected, c = res.cells;
    return '期望计数（公式，未取整）：真阳性 ' + fmtCount(e.tp) + ' · 假阳性 ' + fmtCount(e.fp) +
      ' · 假阴性 ' + fmtCount(e.fn) + ' · 真阴性 ' + fmtCount(e.tn) +
      '。画布格子（取整后合计 ' + activityState.N + '）：真阳性 ' + c.tp +
      ' · 假阳性 ' + c.fp + ' · 假阴性 ' + c.fn + ' · 真阴性 ' + c.tn + '。';
  }

  // ---------------------------------------------------------------------------
  // Import / export
  // ---------------------------------------------------------------------------
  function exportState() {
    try {
      var blob = new Blob([JSON.stringify(App.state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'forge-state-' + model.id + '-r' + App.state.revision + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      setSave('saved', '已导出状态文件');
    } catch (err) {
      setSave('error', '导出失败：' + err.message);
    }
  }
  function importIncoming(incoming) {
    App.importError = null;
    if (App.mode === 'server') {
      enqueue({ type: 'import', state: incoming });
      return;
    }
    try {
      var merged = mergeLocal(App.state, incoming);
      App.state = merged;
      App.view = computeView();
      persistStandalone();
      setSaved('导入已合并');
      render();
    } catch (err) {
      App.importError = err.message;
      renderImportBanner();
      setSave('error', '导入失败：' + err.message);
    }
  }
  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try { incoming = JSON.parse(String(reader.result)); }
      catch (err) { App.importError = '文件不是合法 JSON：' + err.message; renderImportBanner(); return; }
      if (!incoming || typeof incoming !== 'object') { App.importError = '文件内容不是 JSON 对象'; renderImportBanner(); return; }
      if (incoming.schemaVersion !== 1 && incoming.schemaVersion !== 2) {
        App.importError = typeof incoming.schemaVersion === 'number' && incoming.schemaVersion > 2
          ? '档案格式版本 ' + incoming.schemaVersion + ' 高于当前工具支持的版本 2；请升级 forge 工具'
          : '状态 schemaVersion 必须是 1 或 2';
        renderImportBanner(); return;
      }
      if (incoming.modelId !== model.id) { App.importError = '状态属于模型 ' + incoming.modelId + '，与当前模型 ' + model.id + ' 不一致，拒绝导入'; renderImportBanner(); return; }
      importIncoming(incoming);
    };
    reader.onerror = function () { App.importError = '读取文件失败'; renderImportBanner(); };
    reader.readAsText(file);
  }

  // ---------------------------------------------------------------------------
  // Graph events
  // ---------------------------------------------------------------------------
  function bindGraphEvents() {
    var stage = $('#graphStage');
    var dragging = false;
    var dragStart = null;
    var pointers = new Map();

    stage.addEventListener('pointerdown', function (ev) {
      if (ev.target.closest && (ev.target.closest('.node') || ev.target.closest('.rel-label'))) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 1) {
        dragging = true;
        dragStart = { x: ev.clientX, y: ev.clientY, tx: App.viewport.tx, ty: App.viewport.ty };
        try { stage.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      }
    });
    stage.addEventListener('pointermove', function (ev) {
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size >= 2) {
        var pts = Array.from(pointers.values());
        var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        var mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        if (stage._lastPinch) {
          var rect = stage.getBoundingClientRect();
          var factor = dist / stage._lastPinch.dist;
          zoomAt(mid.x - rect.left, mid.y - rect.top, factor);
          App.viewport.tx += mid.x - stage._lastPinch.mid.x;
          App.viewport.ty += mid.y - stage._lastPinch.mid.y;
          applyViewport();
        }
        stage._lastPinch = { dist: dist, mid: mid };
        return;
      }
      if (dragging && dragStart) {
        App.viewport.tx = dragStart.tx + (ev.clientX - dragStart.x);
        App.viewport.ty = dragStart.ty + (ev.clientY - dragStart.y);
        applyViewport();
      }
    });
    function endPointer(ev) {
      pointers.delete(ev.pointerId);
      if (pointers.size < 2) stage._lastPinch = null;
      if (pointers.size === 0) dragging = false;
    }
    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);
    stage.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var rect = stage.getBoundingClientRect();
      zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, { passive: false });

    $('#nodeLayer').addEventListener('click', function (ev) {
      var btn = ev.target.closest && ev.target.closest('[data-collapse]');
      if (btn) { ev.stopPropagation(); toggleCollapse(btn.getAttribute('data-collapse')); return; }
      var node = ev.target.closest && ev.target.closest('.node');
      if (node) selectConcept(node.getAttribute('data-id'));
    });
    $('#nodeLayer').addEventListener('dblclick', function (ev) {
      var node = ev.target.closest && ev.target.closest('.node');
      if (node) toggleCollapse(node.getAttribute('data-id'));
    });
    $('#nodeLayer').addEventListener('keydown', function (ev) {
      var node = ev.target.closest && ev.target.closest('.node');
      if (!node) return;
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectConcept(node.getAttribute('data-id')); }
      else if (ev.key === 'c') { ev.preventDefault(); toggleCollapse(node.getAttribute('data-id')); }
    });

    // Keyboard navigation on the graph container.
    $('#graph').addEventListener('keydown', function (ev) {
      var step = 60;
      if (ev.key === 'ArrowLeft') { App.viewport.tx += step; applyViewport(); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight') { App.viewport.tx -= step; applyViewport(); ev.preventDefault(); }
      else if (ev.key === 'ArrowUp') { App.viewport.ty += step; applyViewport(); ev.preventDefault(); }
      else if (ev.key === 'ArrowDown') { App.viewport.ty -= step; applyViewport(); ev.preventDefault(); }
      else if (ev.key === '+' || ev.key === '=') { var r = $('#graphStage').getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.15); ev.preventDefault(); }
      else if (ev.key === '-') { var r2 = $('#graphStage').getBoundingClientRect(); zoomAt(r2.width / 2, r2.height / 2, 1 / 1.15); ev.preventDefault(); }
      else if (ev.key === 'f' || ev.key === 'F' || ev.key === '0') { fitView(); ev.preventDefault(); }
    });

    // Toolbar
    document.querySelectorAll('.graph-toolbar [data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act');
        var rect = $('#graphStage').getBoundingClientRect();
        if (act === 'fit') fitView();
        else if (act === 'zoom-in') zoomAt(rect.width / 2, rect.height / 2, 1.15);
        else if (act === 'zoom-out') zoomAt(rect.width / 2, rect.height / 2, 1 / 1.15);
        else if (act === 'focus') { App.focusedId = App.selectedId; persistUi(); render(); fitView(); }
        else if (act === 'overview') { App.focusedId = null; persistUi(); render(); fitView(); }
        else if (act === 'expand') { App.collapsed.clear(); persistUi(); render(); fitView(); }
        else if (act === 'collapse') {
          App.collapsed.clear();
          App.concepts.forEach(function (c) {
            if (c.id !== (ROOT && ROOT.id) && (App.childOf.get(c.id) || []).length) App.collapsed.add(c.id);
          });
          persistUi(); render(); fitView();
        }
      });
    });
    var relToggle = $('#relLabels');
    relToggle.checked = App.showRelLabels;
    relToggle.addEventListener('change', function () { App.showRelLabels = relToggle.checked; persistUi(); renderGraph(); });
    $('#exportBtn').addEventListener('click', exportState);
    $('#importBtn').addEventListener('click', function () { $('#importFile').click(); });
    $('#importFile').addEventListener('change', function (ev) {
      var file = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      handleImportFile(file);
    });
  }

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  function detectMode() {
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      return fetch('/api/state', { headers: { 'Accept': 'application/json' } })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) {
          if (data && data.state) {
            if ((data.modelFingerprint && data.modelFingerprint !== App.baseModelFingerprint) ||
                (data.state.modelFingerprint && data.state.modelFingerprint !== App.baseModelFingerprint)) {
              App.modelChangedOnServer = true;
            } else {
              App.state = ensureState(data.state);
              if (data.view) App.view = data.view;
              if (data.promptFingerprints) App.promptFingerprints = data.promptFingerprints;
              if (data.conceptFingerprints) App.conceptFingerprints = data.conceptFingerprints;
            }
            App.mode = 'server';
            return;
          }
          App.mode = 'standalone';
        })
        .catch(function () { App.mode = 'standalone'; });
    }
    App.mode = 'standalone';
    return Promise.resolve();
  }
  function afterStandaloneLoad() {
    if (App.mode !== 'standalone') return;
    var cached = loadCachedState();
    // The revision counters on the product and the cache are independent, so the
    // guard is "a cache exists", not "the cache is newer". A lower-revision cache
    // can hold the newer learner deltas (a correction, note, draft or later
    // submission); those must reconcile against the trusted payload instead of
    // being discarded by a whole-archive comparison.
    if (cached) App.state = reconcileCachedContent(cached, App.state);
  }
  // Reconcile a browser cache with the trusted built payload. The payload is the
  // agent-side product: its immutable attempts, current tutor results, evidence
  // and content identity are authoritative and form the base. The cache
  // contributes learner deltas only — newer notes, drafts, corrections, self
  // assessments, help and submissions. The cache can never mint tutor events,
  // evidence, review requests or schedules: cached-only authority is quarantined
  // as a read-only historical audit and reported, never activated.
  function reconcileCachedContent(cached, payload) {
    var modelChanged = cached.modelFingerprint !== App.modelFingerprint;
    var found = [];
    var quarantined = [];
    var noteHistoryConflicts = [];
    var next = ensureState(clone(payload));
    next.attempts = mergeCachedAttempts(next.attempts || {}, cached.attempts || {}, found, quarantined);
    next.attempts = enforceGlobalEventIds(next.attempts, payload.attempts || {}, found, 'cache-reconcile');
    next.practiceSessions = mergePracticeLocal(next.practiceSessions || {}, cached.practiceSessions || {}, found);
    next.interactionPositions = interactionMergePositions(next.interactionPositions || {}, cached.interactionPositions || {}, found, nowIso());
    // Conflict controls describe kept as the browser cache and incoming as the
    // rebuilt page. Keep that orientation for learner-owned round choices too.
    next.learningRounds = mergeRoundsLocal(cached.learningRounds || {}, next.learningRounds || {}, found);
    next.activeRoundId = next.activeRoundId || cached.activeRoundId || null;
    var revisions = mergeCachedRecords(cached.conceptRevisions || {}, next.conceptRevisions || {}, 'conceptRevisions', 'title');
    next.conceptRevisions = revisions.bucket;
    found = found.concat(revisions.conflicts);
    var relations = mergeCachedRecords(cached.relationRevisions || {}, next.relationRevisions || {}, 'relationRevisions', 'label');
    next.relationRevisions = relations.bucket;
    found = found.concat(relations.conflicts);
    var explanations = mergeCachedRecords(cached.explanations || {}, next.explanations || {}, 'explanations', 'text');
    next.explanations = insightMergeNotes(explanations.bucket, next.explanations || {}, noteHistoryConflicts, nowIso(), 'explanations');
    found = found.concat(explanations.conflicts);
    var summaries = mergeCachedRecords(cached.summaries || {}, next.summaries || {}, 'summaries', 'text');
    next.summaries = insightMergeNotes(summaries.bucket, next.summaries || {}, noteHistoryConflicts, nowIso(), 'summaries');
    found = found.concat(summaries.conflicts);
    var own = mergeCachedRecords(cached.ownQuestions || {}, next.ownQuestions || {}, 'ownQuestions', 'text');
    next.ownQuestions = own.bucket;
    found = found.concat(own.conflicts);
    // Payload tutor evidence is the only trusted source. A cache-only record is
    // quarantined as a historical audit; a shared id keeps the payload record.
    next.conceptEvidence = quarantineCachedEvidence(next.conceptEvidence || {}, cached.conceptEvidence || {}, 'conceptEvidence', quarantined);
    next.promptEvidence = quarantineCachedEvidence(next.promptEvidence || {}, cached.promptEvidence || {}, 'promptEvidence', quarantined);
    // Review requests are agent-side authority: a cached-only request is never
    // adopted, only reported, so a forged cache cannot inject a completed result.
    next.reviewRequests = mergeReviewRequestsLocal(next.reviewRequests || {}, cached.reviewRequests || {}, quarantined, false);
    // Teaching corrections follow the same rule: the built payload is the only
    // trusted source (a CLI correction always ships with a rebuild), so a
    // cache-only correction is reported and never adopted, and a divergent
    // same-id record keeps the payload version.
    next.teachingCorrections = correctionMergeTeaching(next.teachingCorrections || {}, cached.teachingCorrections || {}, quarantined, nowIso(), false);
    // Schedules are computed, never minted by the cache. The payload's stored
    // arrangements are the starting point; every prompt is then replayed from the
    // merged attempt stream so the result is exactly what the current
    // assessments imply. A divergent cached arrangement survives only as an
    // audit record.
    var scheduleConflicts = mergeCachedScheduleAudits(next.schedules || {}, cached.schedules || {});
    Object.keys(next.attempts).forEach(function (pid) { recomputeSchedule(next, pid); });
    next.migrations = mergeMigrationLists(payload.migrations || [], cached.migrations || []);
    next.orphans = mergeOrphanNotices(next.orphans, cached.orphans);
    // A divergent same-id learner edit is not silently discarded: both versions
    // are kept in a durable conflict and surfaced for a learner choice. A
    // quarantined authority conflict is recorded as a resolved audit so reopening
    // never recreates it and it can never be adopted by a stale cache.
    // The durable conflict/resolution history lives in the cache (a learner
    // already chose a side); the payload's own conflicts are unioned in and any
