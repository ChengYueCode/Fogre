      // taken from: same prompt, original text, submission time and assistance
      // facts. Otherwise a corrupted snapshot could rate a different answer that
      // merely reuses the id.
      if (source) {
        if (source.promptId !== member.promptId) {
          throw tutorFail('E_STATE', '复核成员的问题与原答不一致：' + member.attemptId, memberPath + '.promptId');
        }
        if (source.answer !== member.answer) {
          throw tutorFail('E_STATE', '复核成员的原文与原答不一致：' + member.attemptId, memberPath + '.answer');
        }
        if ((source.at ?? null) !== (member.at ?? null)) {
          throw tutorFail('E_STATE', '复核成员的作答时间与原答不一致：' + member.attemptId, memberPath + '.at');
        }
        if ((source.assisted === true) !== (member.assisted === true)) {
          throw tutorFail('E_STATE', '复核成员的协助事实与原答不一致：' + member.attemptId, memberPath + '.assisted');
        }
        var sourceAssistance = Array.isArray(source.assistance) ? source.assistance.slice().sort() : [];
        var memberAssistance = Array.isArray(member.assistance) ? member.assistance.slice().sort() : [];
        if (!tutorSameValue(sourceAssistance, memberAssistance)) {
          throw tutorFail('E_STATE', '复核成员的协助来源与原答不一致：' + member.attemptId, memberPath + '.assistance');
        }
      }
      var key2 = member.promptId + '|' + member.attemptId;
      if (seen[key2]) throw tutorFail('E_STATE', '复核成员的题目/作答重复：' + key2, memberPath);
      seen[key2] = true;
      if (typeof member.answer !== 'string') throw tutorFail('E_STATE', '复核成员缺少原答快照', memberPath + '.answer');
      // A fingerprint may be absent on a legacy answer frozen from an old
      // archive. Such a member is readable history but can never be current, so
      // it must stay unresolved — a completed status on it is rejected below.
      var hasFingerprint = typeof member.fingerprint === 'string' && member.fingerprint !== '';
      if (TUTOR_MEMBER_STATUSES.indexOf(member.status) === -1) throw tutorFail('E_STATE', '复核成员 status 不合法：' + JSON.stringify(member.status), memberPath + '.status');
      if (member.corrections !== undefined && !Array.isArray(member.corrections)) {
        throw tutorFail('E_STATE', '复核成员 corrections 必须是数组', memberPath + '.corrections');
      }
      var correctionIds = tutorCorrectionIds(member);
      if (member.status === 'completed') {
        if (!hasFingerprint) {
          throw tutorFail('E_STATE', '缺少内容指纹的历史复核成员不能标记为已完成，必须保留待处理', memberPath + '.status');
        }
        if (!tutorIsRecord(member.feedback)) throw tutorFail('E_STATE', '已完成的复核成员缺少反馈', memberPath + '.feedback');
        TUTOR_FEEDBACK_FIELDS.forEach(function (field) {
          if (!tutorIsNonEmptyString(member.feedback[field])) throw tutorFail('E_STATE', '复核反馈缺少 ' + field, memberPath + '.feedback.' + field);
        });
        if (TUTOR_RATINGS.indexOf(member.feedback.rating) === -1) throw tutorFail('E_STATE', '复核反馈 rating 不合法', memberPath + '.feedback.rating');
        var target = member.feedback.targetCorrectionId;
        if (target !== null && target !== undefined && !tutorHasOwn(correctionIds, target)) {
          throw tutorFail('E_STATE', '复核反馈的修正目标不在冻结快照内：' + JSON.stringify(target), memberPath + '.feedback.targetCorrectionId');
        }
      }
      if (member.status !== 'pending' && member.status !== 'completed' && !tutorIsNonEmptyString(member.reason)) {
        throw tutorFail('E_STATE', '待处理复核成员缺少原因', memberPath + '.reason');
      }
    });
  });

  // Refresh re-reads the authoritative state through the existing queue and
  // revision coordination, so a new note/answer/draft that landed locally is
  // never dropped by a stale snapshot. The server owns the review records; the
  // page only adopts the returned state and re-renders.
  function refreshReviewResults() {
    if (App.mode !== 'server') {
      setSave('error', '独立缓存模式无法刷新外部复核结果；请先导出状态交给 AI 会话，再重新打开新版产物');
      return;
    }
    // A refresh must never race the save queue: an in-flight POST (a new note,
    // answer or draft) has a pending local revision, and adopting an older GET
    // snapshot would drop that work. Wait until the queue drains, then refresh
    // from the settled revision.
    if (App.running || App.queue.length) {
      App.refreshReviewWhenIdle = true;
      setSave('saving', '待保存完成后刷新复核结果…');
      return;
    }
    doRefreshReviewResults();

  function doRefreshReviewResults() {
    setSave('saving', '正在刷新复核结果…');

      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || !data.state) throw new Error('服务器未返回状态');
        // A newer local save may have landed while this GET was in flight; a
        // response older than the current revision is ignored so the refresh
        // never rolls the page back over newer learner work.
        if (Number(data.state.revision || 0) < Number(App.state.revision || 0)) {
          setSaved('复核结果已是较新版本');
          return;
        }
        if (!applyServerData(data)) return;
        setSaved('复核结果已刷新');
        render();
      })
      .catch(function (err) { setSave('error', '刷新失败：' + (err && err.message ? err.message : err)); });
  }

  // ----- practice ------------------------------------------------------------
  function practiceHints(prompt) {
    return roundHintTexts(roundModel(), prompt.id);
  }
  function teachingPurposeLabel(purpose) {
    return { explanation: '解释与补漏', variation: '变式与比较', transfer: '新情境应用' }[purpose] || '检索与讨论';
  }
  function freshPractice(binding) {
    return Object.assign({
      sessionId: 'practice-' + crypto.randomUUID(), submitted: false, pendingSubmit: false,
      peeked: false, referenceVisible: false, hintLevel: 0,
      rated: false, pendingRating: null, pendingAttemptId: null, answer: '', draft: ''
    }, binding || {});
  }
  function getPractice(promptId) {
    var binding = routeBinding(promptId);
    var existingPractice = App.practice[promptId];
    if (existingPractice && (existingPractice.roundId !== binding.roundId || existingPractice.taskId !== binding.taskId)) delete App.practice[promptId];
    if (!App.practice[promptId]) {
      var sessions = Object.values(App.state.practiceSessions || {}).filter(function (s) {
        return s.promptId === promptId && s.fingerprint === currentPromptFingerprint(promptId) &&
          s.roundId === binding.roundId && s.taskId === binding.taskId;
      }).sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      var saved = sessions[0];
      var p = freshPractice(binding);
      if (saved) {
        p.sessionId = saved.id; p.draft = saved.draft;
        p.peeked = saved.assistance.length > 0;
        p.hintLevel = saved.hintLevel || 0;
        // A previous explicit reveal remains recorded, but reference starts hidden on reopen.
        var original = (App.state.attempts[promptId] || []).find(function (a) { return a.id === saved.attemptId; });
        if (original) { p.answer = original.answer; p.submitted = true; p.pendingAttemptId = original.id; p.rated = original.rating !== null; }
      } else p.draft = binding.roundId ? '' : getDraft('practice:' + promptId) || '';
      App.practice[promptId] = p;
    }
    var practice = App.practice[promptId];
    var session = (App.state.practiceSessions || {})[practice.sessionId];
    var original = (App.state.attempts[promptId] || []).find(function (a) { return a.id === practice.pendingAttemptId; });
    // Refresh/replay can add help to an already-open draft. Once submitted,
    // the immutable original decides classification, even if help is shown later.
    if (original) practice.peeked = !!original.assisted;
    else if (session) practice.peeked = session.assistance.length > 0;
    if (session) practice.hintLevel = Math.max(practice.hintLevel || 0, session.hintLevel || 0);
    return practice;
  }
  function savePracticeDraft(promptId, value) {
    var p = getPractice(promptId);
    var base = p.draft; p.draft = value;
    setDraft('practice:' + promptId, value);
    enqueue({ type: 'practice', promptId: promptId, sessionId: p.sessionId, draft: value, baseDraft: base });
  }
  function submitPractice(promptId, value) {
    var p = getPractice(promptId);
    if (p.pendingSubmit || p.submitted) return;
    if (p.draft !== value) savePracticeDraft(promptId, value);
    if (!Object.prototype.hasOwnProperty.call(App.state.practiceSessions, p.sessionId) && !App.queue.some(function (a) { return a.type === 'practice' && a.sessionId === p.sessionId; })) {
      enqueue({ type: 'practice', promptId: promptId, sessionId: p.sessionId, draft: value, baseDraft: '' });
    }
    p.answer = value; p.pendingSubmit = true;
    p.pendingAttemptId = p.pendingAttemptId || 'att-' + crypto.randomUUID();
    var assistance = p.peeked ? ['reference'] : [];
    var session = Object.prototype.hasOwnProperty.call(App.state.practiceSessions, p.sessionId) ? App.state.practiceSessions[p.sessionId] : null;
    if (session) assistance = session.assistance.slice();
    App.queue.forEach(function (a) { if (a.type === 'practice' && a.sessionId === p.sessionId) assistance = assistance.concat(a.assistance || []); });
    assistance = Array.from(new Set(assistance)).sort();
    enqueue({ type: 'submit', promptId: promptId, sessionId: p.sessionId,
      attemptId: p.pendingAttemptId, answer: value, assisted: assistance.length > 0, assistance: assistance });
    render();
  }
  function openPractice(promptId, startNew) {
    App.activePromptId = promptId;
    if (startNew) {
      App.practice[promptId] = freshPractice(routeBinding(promptId)); clearDraftKey('practice:' + promptId);
      enqueue({ type: 'practice', promptId: promptId, sessionId: App.practice[promptId].sessionId, draft: '', baseDraft: '' });
    }
    getPractice(promptId);
    App.tab = 'practice';
    persistUi();
    render();
  }
  function promptConceptId(promptId) {
    var prompt = resolvePrompt(promptId);
    return prompt ? prompt.conceptId : null;
  }
  function assessmentSourceLabel(source) {
    return source === 'browser' ? '页面' : source === 'cli' ? '会话/CLI' : (source === 'tutor' ? '导师' : String(source || '未知'));
  }
  function assistanceLabel(sources) {
    var labels = { hint: '提示', reference: '参考', 'tutor-feedback': '导师反馈', starter: '起步帮助', demonstration: '完整示范' };
    return (sources || []).map(function (source) { return labels[source] || source; }).join('、');
  }
  // An assessment names either the original answer or one explicit correction.
  function targetLabel(attempt, targetCorrectionId) {
    if (!targetCorrectionId) return '针对原答案';
    var correction = (attempt.corrections || []).find(function (c) { return c.id === targetCorrectionId; });
    if (!correction) return '针对修正 ' + targetCorrectionId;
    return '针对修正「' + (correction.text.length > 18 ? correction.text.slice(0, 18) + '…' : correction.text) + '」';
  }
  function fmtDate(iso) { return iso ? new Date(iso).toLocaleString('zh-CN') : '—'; }
  // The review-date block states the full time, its source and the exact answer

  // unassessed answer is described separately and the existing date is labelled

  function renderReviewSummary(promptId) {
    var box = h('div', { class: 'review-summary' });

    var latestAssessed = latest ? effectiveAssessment(latest) : null;
    if (!schedule) {
      if (latest && !latestAssessed) box.appendChild(h('p', { class: 'card-sub' }, '待复核 · 待安排：这条作答还没有评价，尚无可依据的复习日期。'));
      else box.appendChild(h('p', { class: 'card-sub' }, schedule === null && latestAssessed
        ? '已有评价，但当前内容下暂无有效安排。' : '尚无复习安排。'));
      return box;
    }
    var overdue = new Date(schedule.dueAt).getTime() <= Date.now();
    var owner = (App.state.attempts[promptId] || []).find(function (a) { return a.id === schedule.attemptId; }) || null;

  // Changing preview controls is read-only; confirmation alone replaces the

  // read, and it never changes mastery.

  // ----- activity (only when model.activity === "bayes-frequency") -----------
  var activityState = { prior: 0.01, sens: 0.9, spec: 0.95, N: 1000 };
  function activityExpected() {
    var N = activityState.N;
    var diseased = N * activityState.prior;
    var healthy = N - diseased;
    var tp = diseased * activityState.sens;
    var fn = diseased * (1 - activityState.sens);
    var fp = healthy * (1 - activityState.spec);
    var tn = healthy * activityState.spec;
    var positives = tp + fp;
    return {
      N: N, diseased: diseased, healthy: healthy,
      tp: tp, fn: fn, fp: fp, tn: tn,
      positives: positives,
      ppv: positives > 0 ? tp / positives : null
    };
  }
  // PPV uses exact expected frequencies. The canvas separately rounds each
  // category to integers while keeping exactly N cells (largest remainder).
  function roundCellsToTotal(expected) {
    var raw = [expected.tp, expected.fp, expected.fn, expected.tn];
    var cells = raw.map(function (v) { return Math.floor(v); });
    var assigned = cells.reduce(function (a, b) { return a + b; }, 0);
    var remainder = expected.N - assigned;
    var byFraction = raw.map(function (v, i) { return { i: i, frac: v - Math.floor(v) }; })
      .sort(function (a, b) { return b.frac - a.frac || a.i - b.i; });
    for (var k = 0; k < remainder; k++) cells[byFraction[k % byFraction.length].i] += 1;
    return { tp: cells[0], fp: cells[1], fn: cells[2], tn: cells[3] };
  }
  function computeActivityResults() {
    var expected = activityExpected();
    return { expected: expected, cells: roundCellsToTotal(expected), ppv: expected.ppv };
  }
  function fmtCount(v) {
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v * 1000) / 1000);
  }
  function ppvText(ppv) {
    if (ppv === null || ppv === undefined) return '无法定义（没有阳性）';
    return (ppv * 100).toFixed(1) + '%';
  }
  function drawActivity(canvas) {
    var res = computeActivityResults();
    var cells = res.cells;
    var cols = 40;
    var rows = Math.ceil(activityState.N / cols);
    var cell = 12;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cols * cell * dpr;
    canvas.height = rows * cell * dpr;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cols * cell, rows * cell);

    function fillCell(index, color) {
      var x = (index % cols) * cell;
      var y = Math.floor(index / cols) * cell;
      ctx.fillStyle = color;
      ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
    }
    var colors = { tp: '#2f6b45', fp: '#d98f2b', fn: '#b0533c', tn: '#e7ddca' };
    var index = 0;
    var i;
    for (i = 0; i < cells.tp; i++) fillCell(index++, colors.tp);
    for (i = 0; i < cells.fp; i++) fillCell(index++, colors.fp);
    for (i = 0; i < cells.fn; i++) fillCell(index++, colors.fn);
    for (i = 0; i < cells.tn; i++) fillCell(index++, colors.tn);
    return res;
  }
  function formatActivityResults(res) {
    var e = res.expected, c = res.cells;
    return '期望计数（公式，未取整）：真阳性 ' + fmtCount(e.tp) + ' · 假阳性 ' + fmtCount(e.fp) +
      ' · 假阴性 ' + fmtCount(e.fn) + ' · 真阴性 ' + fmtCount(e.tn) +
      '。画布格子（取整后合计 ' + activityState.N + '）：真阳性 ' + c.tp +
      ' · 假阳性 ' + c.fp + ' · 假阴性 ' + c.fn + ' · 真阴性 ' + c.tn + '。';
  }
  function renderActivityPanel() {
    var frag = document.createDocumentFragment();
    frag.appendChild(section('贝叶斯频率可视化', [
      h('p', {}, '把 1000 个人画成方格：先按患病率分成患病与健康两组，再按灵敏度和特异度分成真阳性、假阳性、假阴性和真阴性。改变先验（患病率）时，健康人数量变化，假阳性的绝对人数随之变化，于是阳性预测值改变。'),
      h('p', {}, '阳性预测值（PPV）用公式的期望计数计算，不对计数先四舍五入；画布为了保持 1000 个整数格子会单独取整，所以个别类别的格子可能与期望计数相差 1，PPV 仍以期望计数为准。'),
      h('p', { class: 'card-sub' }, '本模型把灵敏度和特异度当作固定、已知的检测特性，不假设检测对所有人都无偏；这套数值只用于教学，对应理想的单次二分类检测，不对应真实疾病或检测。')
    ]));
    var controls = h('div', { class: 'activity-controls' });
    function slider(labelText, key, min, max, step, format) {

      return { row: row, update: update };
    }
    var priorCtrl = slider('患病率 / 先验', 'prior', 0.001, 0.5, 0.001, function (v) { return (v * 100).toFixed(1) + '%'; });
    var sensCtrl = slider('灵敏度', 'sens', 0.5, 1, 0.01, function (v) { return (v * 100).toFixed(0) + '%'; });
    var specCtrl = slider('特异度', 'spec', 0.5, 1, 0.01, function (v) { return (v * 100).toFixed(0) + '%'; });
    controls.appendChild(priorCtrl.row);
    controls.appendChild(sensCtrl.row);
    controls.appendChild(specCtrl.row);

    // canvas + readouts
    var canvas = h('canvas', { id: 'activityCanvas', 'aria-label': '1000 人患病与检测结果的频率方格' });
    var results = h('div', { id: 'activityResults', class: 'activity-readout' });
    var ppvBox = h('div', { class: 'activity-readout' }, [h('span', {}, '阳性预测值 PPV：'), h('span', { id: 'activityPPV', class: 'ppv-big' }, '')]);
    var legend = h('div', { class: 'grid-legend' }, [
      h('span', {}, [h('span', { class: 'swatch', style: { background: '#2f6b45' } }), '真阳性']),
      h('span', {}, [h('span', { class: 'swatch', style: { background: '#d98f2b' } }), '假阳性']),
      h('span', {}, [h('span', { class: 'swatch', style: { background: '#b0533c' } }), '假阴性']),
      h('span', {}, [h('span', { class: 'swatch', style: { background: '#e7ddca' } }), '真阴性'])
    ]);
    frag.appendChild(section('先验与检测特性', [controls, canvas, legend, ppvBox, results]));
    var links = h('div', { class: 'chips' });
    [{ id: 'prior', label: '先验概率' }, { id: 'sensitivity-specificity', label: '灵敏度与特异度' },
      { id: 'ppv', label: '阳性预测值' }, { id: 'natural-frequencies', label: '自然频率树' }].forEach(function (item) {
      if (!App.byId.has(item.id)) return;
      links.appendChild(h('button', {
        type: 'button', class: 'chip', onclick: function () { selectConcept(item.id); }
      }, item.label));
    });
    frag.appendChild(section('相关概念', [links]));

    // Defer drawing until the canvas is in the document.
    setTimeout(function () {
      var c = $('#activityCanvas');
      if (c) {
        var r = drawActivity(c);
        $('#activityResults').textContent = formatActivityResults(r);
        $('#activityPPV').textContent = ppvText(r.ppv);
      }
    }, 0);
    return frag;
  }

  // ---------------------------------------------------------------------------
  // Import / export
  // ---------------------------------------------------------------------------
  function exportState() {
    try {
      var blob = new Blob([JSON.stringify(App.state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'forge-state-' + model.id + '-r' + App.state.revision + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      setSave('saved', '已导出状态文件');
    } catch (err) {
      setSave('error', '导出失败：' + err.message);
    }
  }
  function importIncoming(incoming) {
    App.importError = null;
    if (App.mode === 'server') {
      enqueue({ type: 'import', state: incoming });
      return;
    }
    try {
      var merged = mergeLocal(App.state, incoming);
      App.state = merged;
      App.view = computeView();
      persistStandalone();
      setSaved('导入已合并');
      render();
    } catch (err) {
      App.importError = err.message;
      renderImportBanner();
      setSave('error', '导入失败：' + err.message);
    }
  }
  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try { incoming = JSON.parse(String(reader.result)); }
      catch (err) { App.importError = '文件不是合法 JSON：' + err.message; renderImportBanner(); return; }
      if (!incoming || typeof incoming !== 'object') { App.importError = '文件内容不是 JSON 对象'; renderImportBanner(); return; }
      if (incoming.schemaVersion !== 1 && incoming.schemaVersion !== 2) {
        App.importError = typeof incoming.schemaVersion === 'number' && incoming.schemaVersion > 2
          ? '档案格式版本 ' + incoming.schemaVersion + ' 高于当前工具支持的版本 2；请升级 forge 工具'
          : '状态 schemaVersion 必须是 1 或 2';
        renderImportBanner(); return;
      }
      if (incoming.modelId !== model.id) { App.importError = '状态属于模型 ' + incoming.modelId + '，与当前模型 ' + model.id + ' 不一致，拒绝导入'; renderImportBanner(); return; }
      importIncoming(incoming);
    };
    reader.onerror = function () { App.importError = '读取文件失败'; renderImportBanner(); };
    reader.readAsText(file);
  }

  // ---------------------------------------------------------------------------
  // Graph events
  // ---------------------------------------------------------------------------
  function bindGraphEvents() {
    var stage = $('#graphStage');
    var dragging = false;
    var dragStart = null;
    var pointers = new Map();

    stage.addEventListener('pointerdown', function (ev) {
      if (ev.target.closest && (ev.target.closest('.node') || ev.target.closest('.rel-label'))) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 1) {
        dragging = true;
        dragStart = { x: ev.clientX, y: ev.clientY, tx: App.viewport.tx, ty: App.viewport.ty };
        try { stage.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      }
    });
    stage.addEventListener('pointermove', function (ev) {
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size >= 2) {
        var pts = Array.from(pointers.values());
        var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        var mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        if (stage._lastPinch) {
          var rect = stage.getBoundingClientRect();
          var factor = dist / stage._lastPinch.dist;
          zoomAt(mid.x - rect.left, mid.y - rect.top, factor);
          App.viewport.tx += mid.x - stage._lastPinch.mid.x;
          App.viewport.ty += mid.y - stage._lastPinch.mid.y;
          applyViewport();
        }
        stage._lastPinch = { dist: dist, mid: mid };
        return;
      }
      if (dragging && dragStart) {
        App.viewport.tx = dragStart.tx + (ev.clientX - dragStart.x);
        App.viewport.ty = dragStart.ty + (ev.clientY - dragStart.y);
        applyViewport();
      }
    });
    function endPointer(ev) {
      pointers.delete(ev.pointerId);
      if (pointers.size < 2) stage._lastPinch = null;
      if (pointers.size === 0) dragging = false;
    }
    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);
    stage.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var rect = stage.getBoundingClientRect();
      zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, { passive: false });

    $('#nodeLayer').addEventListener('click', function (ev) {
      var btn = ev.target.closest && ev.target.closest('[data-collapse]');
      if (btn) { ev.stopPropagation(); toggleCollapse(btn.getAttribute('data-collapse')); return; }
      var node = ev.target.closest && ev.target.closest('.node');
      if (node) selectConcept(node.getAttribute('data-id'));
    });
    $('#nodeLayer').addEventListener('dblclick', function (ev) {
      var node = ev.target.closest && ev.target.closest('.node');
      if (node) toggleCollapse(node.getAttribute('data-id'));
    });
    $('#nodeLayer').addEventListener('keydown', function (ev) {
      var node = ev.target.closest && ev.target.closest('.node');
      if (!node) return;
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectConcept(node.getAttribute('data-id')); }
      else if (ev.key === 'c') { ev.preventDefault(); toggleCollapse(node.getAttribute('data-id')); }
    });

    // Keyboard navigation on the graph container.
    $('#graph').addEventListener('keydown', function (ev) {
      var step = 60;
      if (ev.key === 'ArrowLeft') { App.viewport.tx += step; applyViewport(); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight') { App.viewport.tx -= step; applyViewport(); ev.preventDefault(); }
      else if (ev.key === 'ArrowUp') { App.viewport.ty += step; applyViewport(); ev.preventDefault(); }
      else if (ev.key === 'ArrowDown') { App.viewport.ty -= step; applyViewport(); ev.preventDefault(); }

      if (canonicalJson(out[id]) !== canonicalJson(cached)) {
        quarantined.push({
          kind: kind, id: id, path: kind + '.' + id, kept: out[id], incoming: cached,
          message: '缓存里的导师证据（' + id + '）与可信产物不同，保留可信产物并报告缓存版本',
        });
      }
    });
    return out;
  }
  // A v1 cache contributes its real migration history; the payload's own entry
  // is kept and the cache's entries that the payload lacks are appended, each at
  // most once. This keeps the upgrade history readable across a reconcile.
  function mergeMigrationLists(payloadMigrations, cachedMigrations) {
    var out = (payloadMigrations || []).slice();
    var seen = new Set(out.map(function (m) { return canonicalJson(m); }));
    (cachedMigrations || []).forEach(function (m) {
      var key = canonicalJson(m);
      if (seen.has(key)) return;
      seen.add(key);
      out.push(m);
    });
    return out;
  }
  // Match the core archive identity: one notice per kind/id, preserving the
  // current side's original notice when reopening or importing the same file.
  function mergeOrphanNotices(current, incoming) {
    var seen = new Set();
    return (current || []).concat(incoming || []).filter(function (notice) {
      var key = JSON.stringify([notice.kind || '', notice.id || '']);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }
  function addCacheOrphan(state, kind, id, message) {
    if ((state.orphans || []).some(function (item) { return item.kind === kind && item.id === id; })) return;
    state.orphans = (state.orphans || []).concat([{ kind: kind, id: id, message: message, at: nowIso() }]);
  }
  function boot() {
    if (!App.view || !App.view.conceptStatus || !App.view.prompts) App.view = computeView();
    return detectMode().then(function () {
      afterStandaloneLoad();
      App.view = computeView();
      return refreshOwnFingerprints();
    }).then(function () {
      var ui = loadUi();
      App.selectedId = (ui.selectedId && App.byId.has(ui.selectedId)) ? ui.selectedId : (ROOT ? ROOT.id : null);
      App.focusedId = (ui.focusedId && App.byId.has(ui.focusedId)) ? ui.focusedId : null;
      App.collapsed = new Set((ui.collapsed || []).filter(function (id) { return App.byId.has(id); }));
      App.tab = ui.tab && tabList().some(function (t) { return t.id === ui.tab; }) ? ui.tab : (currentRound() ? 'round' : 'concept');
      App.showRelLabels = ui.showRelLabels !== false;
      loadDrafts();
      App.view = computeView();
      $('#app').hidden = false;
      renderLegend();
      bindGraphEvents();
      render();
      window.addEventListener('resize', function () {
        if (App.tab === 'activity') renderPanel();
      });
      requestAnimationFrame(function () { fitView(); });
      refreshDue();
    }).catch(function (err) {
      showBootError('初始化学习页失败：' + (err && err.message ? err.message : err));
    });
  }

  // Deterministic hook so a DOM-shim regression can exercise the standalone
  // helpers directly. Production pages never set this flag and boot normally.
  if (window.__EMBER_TEST__) {
    window.__emberInternals = {
      App: App,
      clone: clone,
      nowIso: nowIso,
      ensureState: ensureState,
      computeView: computeView,
      computeActivityResults: computeActivityResults,
      drawActivity: drawActivity,
      formatActivityResults: formatActivityResults,
      ppvText: ppvText,
      activityState: activityState,
      localAction: localAction,
      mergeLocal: mergeLocal,
      listDueLocal: listDueLocal,
      learnerFingerprint: learnerFingerprint,
      setOwnFingerprint: setOwnFingerprint,
      refreshOwnFingerprints: refreshOwnFingerprints,
      currentPromptFingerprint: currentPromptFingerprint,
      isPromptStale: isPromptStale,
      isAttemptActive: isAttemptActive,
      isPromptEvidenceActive: isPromptEvidenceActive,
      isConceptEvidenceActive: isConceptEvidenceActive,
      resetStreakIfContentChanged: resetStreakIfContentChanged,
      nextInterval: nextInterval,
      effectiveAssessment: effectiveAssessment,
      recomputeSchedule: recomputeSchedule,
      replaySchedule: replaySchedule,
      addSelfAssessment: addSelfAssessment,
      stripImportedTutorEvents: stripImportedTutorEvents,
      mergeReviewRequestsLocal: mergeReviewRequestsLocal,
      isIndependentForEvidence: isIndependentForEvidence,
      promptHasEvidenceBasis: promptHasEvidenceBasis,
      tutorReviewSummaryLocal: tutorReviewSummaryLocal,
      renderRoundReviewSection: renderRoundReviewSection,
      refreshReviewResults: refreshReviewResults,
      resolvePrompt: resolvePrompt,
      evidenceRuleSatisfied: evidenceRuleSatisfied,
      referencedAttempts: referencedAttempts,
      LAYOUT: LAYOUT,
      wrapTextLocal: wrapTextLocal,
      measureNodeText: measureNodeText,
      displayLines: displayLines,
      reflowMetric: reflowMetric,
      reflowLayout: reflowLayout,
      ensureLayout: ensureLayout,
      persistStandalone: persistStandalone,
      afterStandaloneLoad: afterStandaloneLoad,
      reconcileCachedContent: reconcileCachedContent,
      mergeCachedAttempts: mergeCachedAttempts,
      quarantineCachedEvidence: quarantineCachedEvidence,
      mergeCachedScheduleAudits: mergeCachedScheduleAudits,
      enforceGlobalEventIds: enforceGlobalEventIds,
      renderHandoffPanel: renderHandoffPanel,
      renderInsightsPanel: renderInsightsPanel,
      renderMaterialMap: renderMaterialMap,
      renderSourcesPanel: renderSourcesPanel,
      attemptHistory: attemptHistory,
      renderReviewBudgetPanel: renderReviewBudgetPanel,
      setCacheConflictValue: setCacheConflictValue,
      renderInteractionsPanel: renderInteractionsPanel,
      interactionForConcept: interactionForConcept,
      interactionComparisonView: interactionComparisonView,
      retryCache: retryCache,
      lsSet: lsSet,
      savedStatus: savedStatus,
      exportState: exportState,
      markStorageError: markStorageError
    };
    return;
  }
  boot();
})();
</script>
