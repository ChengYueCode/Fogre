</text>
<text x="76" y="181.1" font-size="17" fill="#472a2b" text-anchor="middle">
<tspan x="76" dy="0">先验概率</tspan>
</text>
<text x="144" y="164.3" font-size="11" fill="#7b5557" text-anchor="end">
<tspan x="144" dy="0">难度 1</tspan>
</text>
<text x="276.5" y="181.1" font-size="17" fill="#472a2b" text-anchor="middle">
