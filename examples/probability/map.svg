<text x="0" y="-89.6" font-size="24" fill="#472a2b" text-anchor="start">
<tspan x="0" dy="0">条件概率与贝叶斯更新</tspan>
</text>
<text x="0" y="-56.1" font-size="15" fill="#7b5557" text-anchor="start">
<tspan x="0" dy="0">目标：能用先验、检测特性和自然频率解释并计算阳性预测值，并说清先验如何改变结论。</tspan>
</text>
<text x="477" y="34.1" font-size="17" fill="#472a2b" text-anchor="middle">
<tspan x="477" dy="0">条件概率</tspan>
</text>
<text x="545" y="17.3" font-size="11" fill="#7b5557" text-anchor="end">
