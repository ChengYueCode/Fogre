</text>
<text x="642" y="164.3" font-size="11" fill="#7b5557" text-anchor="end">
<tspan x="642" dy="0">难度 3</tspan>
</text>
<text x="477" y="328.1" font-size="17" fill="#472a2b" text-anchor="middle">
<tspan x="477" dy="0">贝叶斯更新</tspan>
</text>
<text x="545" y="311.3" font-size="11" fill="#7b5557" text-anchor="end">
<tspan x="545" dy="0">难度 3</tspan>
</text>
<text x="477" y="475.1" font-size="17" fill="#472a2b" text-anchor="middle">
<tspan x="477" dy="0">自然频率树</tspan>
</text>
<text x="545" y="458.3" font-size="11" fill="#7b5557" text-anchor="end">
<tspan x="545" dy="0">难度 2</tspan>
</text>
<text x="671" y="328.1" font-size="17" fill="#472a2b" text-anchor="middle">
<tspan x="671" dy="0">基础率谬误</tspan>
</text>
<text x="739" y="311.3" font-size="11" fill="#7b5557" text-anchor="end">
<tspan x="739" dy="0">难度 2</tspan>
</text>
<text x="871.5" y="181.1" font-size="17" fill="#472a2b" text-anchor="middle">
<tspan x="871.5" dy="0">后验概率的解读</tspan>
</text>
<text x="946" y="164.3" font-size="11" fill="#7b5557" text-anchor="end">
<tspan x="946" dy="0">难度 3</tspan>
</text>
<text x="276.5" y="252.1" font-size="13" fill="#2857a4" text-anchor="middle">
<tspan x="276.5" dy="0">先验是更新的起点</tspan>
</text>
<text x="428.5" y="178.6" font-size="13" fill="#805200" text-anchor="middle">
<tspan x="428.5" dy="0">检测特性影响阳性预测值</tspan>
</text>
<text x="325" y="178.6" font-size="13" fill="#805200" text-anchor="middle">
