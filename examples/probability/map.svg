</text>
<text x="470.5" y="178.6" font-size="13" fill="#236044" text-anchor="middle">
<tspan x="470.5" dy="0">先验是后验更新的起点</tspan>
</text>
<text x="719.5" y="178.6" font-size="13" fill="#2857a4" text-anchor="middle">
